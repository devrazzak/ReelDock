<!doctype html>
<!--
    Store listing images, composed from the raw captures in ./raw (made by scripts/store-screenshots.mjs).
    Open with ?shot=1|2|3|4|5|6|7|8|tile and screenshot at 1280×800 (tile: 440×280).
-->
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <style>
            * {
                box-sizing: border-box;
                margin: 0;
            }
            body {
                width: 1280px;
                height: 800px;
                overflow: hidden;
                font-family: Inter, system-ui, sans-serif;
            }
            body.tile {
                width: 440px;
                height: 280px;
            }
            .frame {
                position: relative;
                width: 100%;
                height: 100%;
                overflow: hidden;
                color: #fff;
                background: radial-gradient(circle at 15% 20%, #c4162a 0, #7d0209 45%, #2a0306 100%);
            }
            .copy {
                position: absolute;
                left: 80px;
                top: 50%;
                transform: translateY(-50%);
                width: 430px;
            }
            .eyebrow {
                font-size: 16px;
                letter-spacing: 0.12em;
                text-transform: uppercase;
                opacity: 0.75;
                margin-bottom: 18px;
            }
            h1 {
                font-size: 46px;
                line-height: 1.1;
                font-weight: 700;
                margin-bottom: 20px;
            }
            p {
                font-size: 20px;
                line-height: 1.5;
                opacity: 0.88;
            }
            .brand {
                position: absolute;
                left: 80px;
                bottom: 48px;
                display: flex;
                align-items: center;
                gap: 12px;
                font-size: 16px;
                opacity: 0.9;
            }
            .brand img {
                width: 32px;
                height: 32px;
                border-radius: 8px;
                box-shadow: 0 0 0 2px rgb(255 255 255 / 0.85);
            }

            /* A plain "work" window, so the visuals read as "while you work". */
            .work {
                position: absolute;
                border-radius: 14px;
                background: #1e1f24;
                box-shadow: 0 30px 80px rgb(0 0 0 / 0.45);
                overflow: hidden;
            }
            .work .bar {
                height: 34px;
                background: #2a2b31;
                display: flex;
                gap: 8px;
                align-items: center;
                padding: 0 14px;
            }
            .work .bar i {
                width: 12px;
                height: 12px;
                border-radius: 50%;
                background: #55565e;
                display: block;
            }
            .work .lines {
                padding: 22px 26px;
                display: grid;
                gap: 12px;
            }
            .work .lines span {
                height: 10px;
                border-radius: 5px;
                background: #3a3c45;
                display: block;
            }
            .shot {
                position: absolute;
                border-radius: 16px;
                box-shadow: 0 30px 80px rgb(0 0 0 / 0.5);
                display: block;
            }
            .label {
                position: absolute;
                font-size: 15px;
                background: rgb(255 255 255 / 0.14);
                padding: 8px 14px;
                border-radius: 999px;
                backdrop-filter: blur(6px);
            }

            .tile .frame {
                display: flex;
                flex-direction: column;
                justify-content: center;
                padding: 0 32px;
                gap: 12px;
            }
            .tile img {
                width: 56px;
                height: 56px;
                border-radius: 14px;
                box-shadow: 0 0 0 3px rgb(255 255 255 / 0.9);
            }
            .tile h1 {
                font-size: 30px;
                margin: 0;
            }
            .tile p {
                font-size: 15px;
            }
        </style>
    </head>
    <body>
        <script src="raw/launcher.js"></script>
        <script>
            const shot = new URLSearchParams(location.search).get('shot') ?? '1';
            const lines = n =>
                Array.from({ length: n }, (_, i) => `<span style="width:${40 + ((i * 37) % 55)}%"></span>`).join('');
            const work = (style, n) =>
                `<div class="work" style="${style}"><div class="bar"><i></i><i></i><i></i></div><div class="lines">${lines(n)}</div></div>`;
            const brand = `<div class="brand"><img src="raw/icon-128.png" alt="" />ReelDock</div>`;

            const shots = {
                1: `
                    <div class="copy">
                        <div class="eyebrow">Background playback</div>
                        <h1>Keep Reels playing while you work</h1>
                        <p>Switch to any tab. The sound keeps going and the next Reel starts by itself.</p>
                    </div>
                    ${work('left:560px;top:110px;width:640px;height:520px', 18)}
                    <img class="shot" src="raw/popup-light-cropped.png" style="left:860px;top:150px;width:340px" />
                    <div class="label" style="left:600px;top:660px">You keep working · Reels keep playing</div>
                    ${brand}`,
                2: `
                    <div class="copy">
                        <div class="eyebrow">Mini player</div>
                        <h1>A floating player, always on top</h1>
                        <p>Move and resize it anywhere. Scroll, drag or use the arrow keys to change Reels, and skip 10 seconds.</p>
                    </div>
                    ${work('left:540px;top:90px;width:680px;height:600px', 22)}
                    <img class="shot" src="raw/mini-player.png" style="left:930px;top:130px;width:270px" />
                    ${brand}`,
                3: `
                    <div class="copy">
                        <div class="eyebrow">Simple controls</div>
                        <h1>Everything in one click</h1>
                        <p>Play, pause, skip, ±10 seconds, background playback and auto next. Light and dark mode.</p>
                    </div>
                    <img class="shot" src="raw/popup-light-cropped.png" style="left:600px;top:90px;width:300px" />
                    <img class="shot" src="raw/popup-dark-cropped.png" style="left:920px;top:150px;width:300px" />
                    ${brand}`,
                4: (() => {
                    // The right part of the real Facebook page (store-assets/real, 3600×2014), the button ringed.
                    const button = { x: 3527, y: 1253, size: 92 };
                    const box = { left: 540, top: 90, width: 700, height: 600 };
                    const crop = { x: 1450, width: 2150 };
                    const scale = box.width / crop.width;
                    crop.y = Math.round(button.y - box.height / scale / 2);
                    const cx = box.left + (button.x - crop.x) * scale;
                    const cy = box.top + (button.y - crop.y) * scale;
                    const ring = button.size * scale + 26;
                    return `
                    <div class="copy">
                        <div class="eyebrow">Where to find it</div>
                        <h1>One click opens the mini player</h1>
                        <p>On any Reel or Short, click the button under the up and down arrows on the right.</p>
                    </div>
                    <div class="work" style="left:${box.left}px;top:${box.top}px;width:${box.width}px;height:${box.height}px;background:#000">
                        <img src="real/facebook.png" alt="" style="position:absolute;width:${3600 * scale}px;left:${-crop.x * scale}px;top:${-crop.y * scale}px" />
                    </div>
                    <div style="position:absolute;left:${cx - ring / 2}px;top:${cy - ring / 2}px;width:${ring}px;height:${ring}px;border:4px solid #fff;border-radius:50%;box-shadow:0 0 0 8px rgb(255 255 255 / 0.25)"></div>
                    <div class="label" style="left:${cx - 330}px;top:${cy + ring / 2 + 18}px;font-size:17px;background:#fff;color:#7d0209;font-weight:600">Click here to open the mini player ↗</div>
                    ${brand}`;
                })(),
                5: (() => {
                    // Real pages from the user's browser, with our demo Reel in place of the video and personal
                    // details removed (store-assets/real). The logos are the official SVGs, unmodified.
                    const sites = [
                        { name: 'Facebook Reels', image: 'real/facebook.png', icon: 'logos/facebook-white.svg' },
                        { name: 'YouTube Shorts', image: 'real/youtube.png', icon: '../public/site-icons/youtube.svg' },
                        { name: 'Instagram Reels', image: 'real/instagram.png', icon: '../public/site-icons/instagram.svg' },
                    ];
                    // A 2×2 grid: the text in the first cell, one whole page in each of the others.
                    const width = 560;
                    const height = Math.round((width * 2014) / 3600);
                    const cells = [
                        { left: 660, top: 40 },
                        { left: 60, top: 420 },
                        { left: 660, top: 420 },
                    ];
                    const windows = sites
                        .map(
                            ({ name, image, icon }, index) => `
                    <div class="work" style="left:${cells[index].left}px;top:${cells[index].top}px;width:${width}px">
                        <div class="bar" style="gap:10px;font-size:14px;color:#fff">
                            <img src="${icon}" alt="" style="width:18px;height:18px" />${name}
                        </div>
                        <img src="${image}" alt="" style="display:block;width:${width}px;height:${height}px" />
                    </div>`,
                        )
                        .join('');
                    return `
                    <div style="position:absolute;left:60px;top:70px;width:540px">
                        <div class="eyebrow">Three sites, one extension</div>
                        <h1>Works on Facebook, YouTube and Instagram</h1>
                        <p>The same background playback, auto next and mini player on every Reels and Shorts page.</p>
                    </div>
                    ${windows}
                    <div class="brand" style="left:60px;bottom:auto;top:330px">
                        <img src="raw/icon-128.png" alt="" />ReelDock
                    </div>`;
                })(),
                // One real page per site (store-assets/real), the launch button ringed. Button centres were measured
                // on the 3600×2014 page images.
                ...Object.fromEntries(
                    [
                        ['6', 'Facebook Reels', 'facebook', 'logos/facebook-white.svg', 'Keeps playing in the background', 3527, 1253],
                        ['7', 'YouTube Shorts', 'youtube', '../public/site-icons/youtube.svg', 'Next Short starts by itself', 3494, 1293],
                        ['8', 'Instagram Reels', 'instagram', '../public/site-icons/instagram.svg', 'One click opens the mini player', 3477, 1185],
                    ].map(([key, name, image, icon, title, bx, by]) => {
                        const box = { left: 120, top: 160, width: 1040 };
                        const scale = box.width / 3600;
                        const height = Math.round(2014 * scale);
                        const cx = box.left + bx * scale;
                        const cy = box.top + 34 + by * scale;
                        const ring = 54;
                        return [
                            key,
                            `
                    <div style="position:absolute;left:120px;top:42px;display:flex;align-items:center;gap:14px">
                        <img src="${icon}" alt="" style="width:30px;height:30px" />
                        <div class="eyebrow" style="margin:0">${name}</div>
                    </div>
                    <h1 style="position:absolute;left:120px;top:82px;margin:0;font-size:44px">${title}</h1>
                    <div class="work" style="left:${box.left}px;top:${box.top}px;width:${box.width}px">
                        <div class="bar"><i></i><i></i><i></i></div>
                        <img src="real/${image}.png" alt="" style="display:block;width:${box.width}px;height:${height}px" />
                    </div>
                    <div style="position:absolute;left:${cx - ring / 2}px;top:${cy - ring / 2}px;width:${ring}px;height:${ring}px;border:4px solid #e0182d;border-radius:50%;box-shadow:0 0 0 6px rgb(224 24 45 / 0.3)"></div>
                    <div class="label" style="left:${cx - ring / 2 - 210}px;top:${cy - 20}px;font-size:16px;background:#e0182d;color:#fff;font-weight:600">Mini player button →</div>`,
                        ];
                    }),
                ),
                tile: `
                    <img src="raw/icon-128.png" alt="" />
                    <h1>ReelDock</h1>
                    <p>Auto scroll Reels &amp; Shorts, mini player</p>`,
            };

            if (shot === 'tile') document.body.classList.add('tile');
            document.body.innerHTML = `<div class="frame">${shots[shot]}</div>`;
        </script>
    </body>
</html>
